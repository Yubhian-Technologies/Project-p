<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vishnu Wellness Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&family=Work+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; background: #F4F0E8; }
      .splash {
        position: fixed; inset: 0; z-index: 2000; background: #F4F0E8;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        transition: opacity 0.7s ease;
        will-change: opacity;
      }
      .splash--exit { opacity: 0; pointer-events: none; }
      .splash-logo {
        width: 96px; height: 96px; border-radius: 50%; object-fit: cover;
        background: #fff; border: 1px solid rgba(46, 43, 39, 0.08); box-shadow: 0 8px 24px rgba(46, 43, 39, 0.1);
      }
      .splash-title {
        margin: 20px 0 0; font-family: 'Playfair Display', Georgia, serif;
        font-size: 22px; font-weight: 600; letter-spacing: -0.01em; color: #2E2B27; text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Intro splash: fades out to reveal the app once it has mounted (see main.tsx). -->
    <div id="splash" class="splash">
      <img src="/favicon.png" alt="Vishnu Wellness Center logo" class="splash-logo" />
      <p class="splash-title">Vishnu Wellness Center</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
